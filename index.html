<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breezeway Supply Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#f4f2ea;
    --panel:#fffdf7;
    --ink:#2a2a26;
    --ink-soft:#6b6a61;
    --line:#e4dfd1;
    --teal:#0f6b63;
    --teal-deep:#0b544d;
    --teal-tint:#e9f2f0;
    --amber:#b9791f;
    --amber-deep:#8f5c12;
    --amber-tint:#fbf1df;
    --focus:#0f6b63;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,20,15,.04), 0 6px 20px rgba(20,20,15,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px 20px 64px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header.app{margin-bottom:22px}
  header.app h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  header.app p{margin:0;color:var(--ink-soft);font-size:13.5px}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:18px;
  }
  .panel > h2{
    font-size:15px;margin:0 0 12px;letter-spacing:-.01em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sub{color:var(--ink-soft);font-size:12.5px;font-weight:400}
  .badge{
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    background:var(--amber-tint);color:var(--amber-deep);
    border:1px solid #ecdcbf;border-radius:999px;padding:2px 8px;
  }

  /* Dropzone */
  .drop{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:#fbfaf4;
    padding:26px 18px;
    text-align:center;
    transition:border-color .15s, background .15s;
    cursor:pointer;
  }
  .drop.drag{border-color:var(--teal);background:var(--teal-tint)}
  .drop strong{display:block;margin-bottom:4px}
  .drop span{color:var(--ink-soft);font-size:13px}
  .drop input[type=file]{display:none}
  .link{color:var(--teal);text-decoration:underline;font-weight:600}

  /* File list */
  ul.files{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.files li{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fffefb;
  }
  ul.files .name{flex:1;font-size:13.5px;word-break:break-all}
  .tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .tag.ok{background:var(--teal-tint);color:var(--teal-deep);border:1px solid #cfe4e0}
  .tag.no{background:#f0efe8;color:var(--ink-soft);border:1px solid var(--line)}
  button.x{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    width:26px;height:26px;line-height:1;cursor:pointer;color:var(--ink-soft);font-size:15px;
  }
  button.x:hover{color:var(--ink);border-color:#d6d0c0}

  /* Controls */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  label.fld{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  select{
    font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }

  /* Buttons */
  .btn{
    font:inherit;font-weight:600;font-size:13.5px;
    border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid transparent;
  }
  .btn.primary{background:var(--teal);color:#fff}
  .btn.primary:hover{background:var(--teal-deep)}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.amber:hover{background:var(--amber-deep)}

  /* Tables */
  .tablewrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:440px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{
    position:sticky;top:0;background:#f3f1e8;color:var(--ink-soft);
    text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:8px 12px;border-bottom:1px solid #efece1;vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--teal-tint)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .foot{margin-top:10px;color:var(--ink-soft);font-size:12.5px}

  /* Two-column area */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:820px){ .grid2{grid-template-columns:1fr} }

  /* Property cards + chips */
  .propcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fffefb}
  .propcard h3{margin:0 0 9px;font-size:13.5px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;background:#fff;
  }
  .chip b{
    background:var(--teal-tint);color:var(--teal-deep);border-radius:999px;
    padding:1px 8px;font-size:11.5px;font-variant-numeric:tabular-nums;
  }

  .empty{color:var(--ink-soft);font-size:13px;padding:6px 0}
  .stack-actions{margin-top:12px}

  a:focus-visible, button:focus-visible, select:focus-visible, .drop:focus-visible{
    outline:2px solid var(--focus);outline-offset:2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>Breezeway Supply Report</h1>
    <p>Drop your Breezeway cleaning exports below. Everything runs in your browser — nothing is uploaded.</p>
  </header>

  <section class="panel">
    <h2>Files <span class="sub">CSV / XLSX / XLS · up to 10</span></h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload spreadsheet files">
      <strong>Drag &amp; drop files here</strong>
      <span>or <span class="link">browse</span> to choose</span>
      <input type="file" id="file" accept=".csv,.xlsx,.xls" multiple />
    </div>
    <ul class="files" id="filelist"></ul>
    <div class="controls">
      <label class="fld" for="report">Report</label>
      <select id="report"></select>
    </div>
  </section>

  <div id="results"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  function esc(v){
    return String(v==null?"":v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  var t = function(v){ return (v==null?"":String(v)).trim(); };

  function stripConfig(v){           // "Beach House · Standard clean" -> "Beach House"
    return t(String(v==null?"":v).split("·")[0]);
  }
  function extractDate(v){           // -> "YYYY-MM-DD" or ""
    if(v==null || v==="") return "";
    if(v instanceof Date && !isNaN(v)){
      // Spreadsheet date cells land at UTC midnight — read them in UTC so the
      // calendar date does not slip a day in negative-offset timezones.
      return v.getUTCFullYear()+"-"+String(v.getUTCMonth()+1).padStart(2,"0")+"-"+String(v.getUTCDate()).padStart(2,"0");
    }
    var s = String(v);
    var iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return iso[0];
    var us = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);   // fallback: M/D/YYYY
    if(us) return us[3]+"-"+us[1].padStart(2,"0")+"-"+us[2].padStart(2,"0");
    var d = new Date(s);
    if(!isNaN(d)) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return "";
  }
  function parseQty(v){              // strip non-numeric, parse number
    if(typeof v === "number") return isFinite(v)?v:0;
    if(v==null) return 0;
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g,""));
    return isNaN(n) ? 0 : n;
  }
  function downloadSheet(aoa, cols, sheetName, fileName){
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    if(cols) ws["!cols"] = cols;
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, fileName);
  }

  /* =========================================================================
     REPORT REGISTRY
     Adding a new report type == append one object here. Nothing else changes.
     Each report:
       id          unique key
       label       dropdown text
       sourceMatch regex the source file name (or a sheet name) must match
       sourceHint  the filename we expect, shown to the user
       columns     logical field -> [accepted header variants]  (case-insensitive, first hit wins)
       render(rows) -> HTMLElement   (rows are objects keyed by logical field, raw values)
     ========================================================================= */
  var REPORTS = [
    {
      id: "supplies-weekly",
      label: "Supply lists (weekly)",
      sourceMatch: /supplies-export/i,
      sourceHint: "breezeway-task-supplies-export.csv",
      columns: {
        property: ["Property"],
        date:     ["Completed date", "Due date"],
        cleaner:  ["Completed by", "Assignees"],
        item:     ["Supply name"],
        qty:      ["Supply quantity"]
      },
      render: function(rows){
        /* ---- normalize ---- */
        var clean = rows.map(function(r){
          return {
            property: stripConfig(r.property),
            date:     extractDate(r.date),
            cleaner:  t(r.cleaner),
            item:     t(r.item),
            qty:      parseQty(r.qty)
          };
        }).filter(function(r){ return r.item; });   // drop rows with no item name

        var root = document.createElement("div");

        /* ---- 1. Supply detail (full width, top) ---- */
        var props = {};
        clean.forEach(function(r){ if(r.property) props[r.property] = true; });
        var propCount = Object.keys(props).length;
        var dates = clean.map(function(r){ return r.date; }).filter(Boolean).sort();
        var range = dates.length ? (dates[0] + "  →  " + dates[dates.length-1]) : "no dated lines";

        var detail = document.createElement("section");
        detail.className = "panel";
        detail.innerHTML =
          '<h2>Supply detail ' +
            '<span class="sub">' + clean.length + ' line' + (clean.length===1?"":"s") +
            ' · ' + propCount + ' propert' + (propCount===1?"y":"ies") + '</span></h2>' +
          '<div class="tablewrap"><table><thead><tr>' +
            '<th>Property</th><th>Clean date</th><th>Cleaner</th><th>Item / supply</th><th class="num">Qty</th>' +
          '</tr></thead><tbody>' +
            clean.map(function(r){
              return '<tr><td>' + esc(r.property) + '</td><td>' + esc(r.date) +
                     '</td><td>' + esc(r.cleaner) + '</td><td>' + esc(r.item) +
                     '</td><td class="num">' + esc(r.qty) + '</td></tr>';
            }).join("") +
          '</tbody></table></div>' +
          '<div class="foot">Clean-date range: ' + esc(range) + '</div>' +
          '<div class="stack-actions"><button class="btn primary" id="dl-detail">Download Supply Detail as Excel</button></div>';

        detail.querySelector("#dl-detail").addEventListener("click", function(){
          var aoa = [["Property","Clean date","Cleaner","Item / supply","Qty"]];
          clean.forEach(function(r){ aoa.push([r.property, r.date, r.cleaner, r.item, r.qty]); });
          downloadSheet(aoa, [{wch:30},{wch:13},{wch:22},{wch:38},{wch:7}], "Supply detail", "supply-detail.xlsx");
        });
        root.appendChild(detail);

        /* ---- shared aggregation ---- */
        var byProp = {};        // property -> { item -> qty }
        var byItem = {};        // item -> qty (all properties/files)
        clean.forEach(function(r){
          var p = r.property || "(no property)";
          (byProp[p] = byProp[p] || {});
          byProp[p][r.item] = (byProp[p][r.item] || 0) + r.qty;
          byItem[r.item] = (byItem[r.item] || 0) + r.qty;
        });

        var grid = document.createElement("div");
        grid.className = "grid2";

        /* ---- 2. Requested by property ---- */
        var reqPanel = document.createElement("section");
        reqPanel.className = "panel";
        var propNames = Object.keys(byProp).sort(function(a,b){ return a.localeCompare(b); });
        reqPanel.innerHTML =
          '<h2>Requested by property <span class="sub">' + propNames.length +
            ' propert' + (propNames.length===1?"y":"ies") + '</span></h2>' +
          (propNames.length ? propNames.map(function(p){
            var items = Object.keys(byProp[p]).sort(function(a,b){ return a.localeCompare(b); });
            return '<div class="propcard"><h3>' + esc(p) + '</h3><div class="chips">' +
              items.map(function(it){
                return '<span class="chip">' + esc(it) + ' <b>' + esc(byProp[p][it]) + '</b></span>';
              }).join("") + '</div></div>';
          }).join("") : '<div class="empty">No supply lines to summarize.</div>');
        grid.appendChild(reqPanel);

        /* ---- 3. Overall item-wise breakdown ("to buy") ---- */
        var itemNames = Object.keys(byItem).sort(function(a,b){ return a.localeCompare(b); });
        var totalUnits = itemNames.reduce(function(s,k){ return s + byItem[k]; }, 0);
        var ovPanel = document.createElement("section");
        ovPanel.className = "panel";
        ovPanel.innerHTML =
          '<h2>Overall breakdown <span class="badge">to buy</span> ' +
            '<span class="sub">' + itemNames.length + ' distinct item' + (itemNames.length===1?"":"s") +
            ' · ' + totalUnits + ' unit' + (totalUnits===1?"":"s") + '</span></h2>' +
          '<div class="tablewrap"><table><thead><tr>' +
            '<th>Item / supply</th><th class="num">Total qty</th>' +
          '</tr></thead><tbody>' +
            (itemNames.length ? itemNames.map(function(it){
              return '<tr><td>' + esc(it) + '</td><td class="num">' + esc(byItem[it]) + '</td></tr>';
            }).join("") : '<tr><td colspan="2" class="empty">Nothing to buy yet.</td></tr>') +
          '</tbody></table></div>' +
          '<div class="stack-actions"><button class="btn amber" id="dl-shop">Download shopping list (Excel)</button></div>';

        ovPanel.querySelector("#dl-shop").addEventListener("click", function(){
          var aoa = [["Item / supply","Total qty"]];
          itemNames.forEach(function(it){ aoa.push([it, byItem[it]]); });
          downloadSheet(aoa, [{wch:42},{wch:11}], "Shopping list", "shopping-list.xlsx");
        });
        grid.appendChild(ovPanel);

        root.appendChild(grid);
        return root;
      }
    }

    /* ----------------------------------------------------------------------
       TEMPLATE — copy, uncomment, and adjust to add a new report type.
       No other code needs to change.

    ,{
      id: "payroll-weekly",
      label: "Payroll (weekly)",
      sourceMatch: /payroll-export/i,
      sourceHint: "breezeway-task-payroll-export.csv",
      columns: {
        cleaner:  ["Completed by", "Assignees"],
        property: ["Property"],
        date:     ["Completed date", "Due date"],
        hours:    ["Hours", "Duration"],
        rate:     ["Rate", "Pay rate"]
      },
      render: function(rows){
        var el = document.createElement("section");
        el.className = "panel";
        // ...normalize rows, build tables/cards, wire up XLSX download buttons...
        return el;
      }
    }
    ---------------------------------------------------------------------- */
  ];

  /* ---------- generic engine ---------- */
  var files = [];   // { name, workbook }

  function nameIsRecognized(name){
    return REPORTS.some(function(r){ return r.sourceMatch.test(name); });
  }

  function resolveHeader(variants, sampleRow){
    var keys = Object.keys(sampleRow);
    var lower = keys.map(function(k){ return k.trim().toLowerCase(); });
    for(var i=0;i<variants.length;i++){
      var idx = lower.indexOf(variants[i].trim().toLowerCase());
      if(idx >= 0) return keys[idx];
    }
    return null;
  }

  // Route uploaded files to a report, resolve logical fields -> real headers.
  function collectRows(report){
    var raw = [];
    files.forEach(function(f){
      f.workbook.SheetNames.forEach(function(sheetName){
        if(report.sourceMatch.test(f.name) || report.sourceMatch.test(sheetName)){
          var arr = XLSX.utils.sheet_to_json(f.workbook.Sheets[sheetName], { defval:null, raw:true });
          raw = raw.concat(arr);
        }
      });
    });
    if(!raw.length) return null;

    var sample = null;
    for(var i=0;i<raw.length;i++){ if(raw[i] && Object.keys(raw[i]).length){ sample = raw[i]; break; } }
    sample = sample || raw[0];

    var map = {};
    Object.keys(report.columns).forEach(function(field){
      map[field] = resolveHeader(report.columns[field], sample);
    });

    return raw.map(function(o){
      var row = {};
      Object.keys(report.columns).forEach(function(field){
        row[field] = map[field] != null ? o[map[field]] : null;
      });
      return row;
    });
  }

  /* ---------- UI wiring ---------- */
  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("file");
  var fileListEl = document.getElementById("filelist");
  var reportSel = document.getElementById("report");
  var resultsEl = document.getElementById("results");

  REPORTS.forEach(function(r){
    var opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = r.label;
    reportSel.appendChild(opt);
  });

  function renderFileList(){
    fileListEl.innerHTML = "";
    files.forEach(function(f, i){
      var recognized = nameIsRecognized(f.name);
      var li = document.createElement("li");
      li.innerHTML =
        '<span class="name">' + esc(f.name) + '</span>' +
        '<span class="tag ' + (recognized ? "ok" : "no") + '">' +
          (recognized ? "recognized" : "not used yet") + '</span>' +
        '<button class="x" aria-label="Remove ' + esc(f.name) + '">&times;</button>';
      li.querySelector("button.x").addEventListener("click", function(){
        files.splice(i, 1);
        renderFileList();
        renderSelected();
      });
      fileListEl.appendChild(li);
    });
  }

  function renderSelected(){
    var report = REPORTS.find(function(r){ return r.id === reportSel.value; });
    resultsEl.innerHTML = "";
    if(!report) return;

    var rows = collectRows(report);
    if(!rows){
      var p = document.createElement("section");
      p.className = "panel";
      p.innerHTML = '<h2>' + esc(report.label) + '</h2>' +
        '<div class="empty">No matching file loaded yet. Expected: <b>' + esc(report.sourceHint) + '</b></div>';
      resultsEl.appendChild(p);
      return;
    }
    resultsEl.appendChild(report.render(rows));
  }

  var ALLOWED = /\.(csv|xlsx|xls)$/i;

  function addFiles(list){
    var arr = Array.prototype.slice.call(list);
    (function next(k){
      if(k >= arr.length){ renderFileList(); renderSelected(); return; }
      var file = arr[k];
      if(!ALLOWED.test(file.name)){ next(k+1); return; }
      if(files.length >= 10){ next(arr.length); return; }
      if(files.some(function(f){ return f.name === file.name; })){ next(k+1); return; }
      var isCsv = /\.csv$/i.test(file.name);
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var wb = isCsv
            // CSV: read as UTF-8 text so accented / bilingual item names survive.
            ? XLSX.read(reader.result, { type:"string", cellDates:true })
            : XLSX.read(new Uint8Array(reader.result), { type:"array", cellDates:true });
          files.push({ name:file.name, workbook:wb });
        }catch(e){ /* skip unreadable file */ }
        next(k+1);
      };
      reader.onerror = function(){ next(k+1); };
      if(isCsv) reader.readAsText(file);
      else reader.readAsArrayBuffer(file);
    })(0);
  }

  drop.addEventListener("click", function(){ fileInput.click(); });
  drop.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener("change", function(){ addFiles(fileInput.files); fileInput.value = ""; });

  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("drag"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("drag"); });
  });
  drop.addEventListener("drop", function(e){
    if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });

  reportSel.addEventListener("change", renderSelected);

  renderSelected();
})();
</script>
</body>
</html>
