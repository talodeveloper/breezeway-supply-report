<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breezeway Supply Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#f4f2ea;
    --panel:#fffdf7;
    --ink:#2a2a26;
    --ink-soft:#6b6a61;
    --line:#e4dfd1;
    --teal:#0f6b63;
    --teal-deep:#0b544d;
    --teal-tint:#e9f2f0;
    --amber:#b9791f;
    --amber-deep:#8f5c12;
    --amber-tint:#fbf1df;
    --focus:#0f6b63;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,20,15,.04), 0 6px 20px rgba(20,20,15,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px 20px 64px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header.app{margin-bottom:22px}
  header.app h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  header.app p{margin:0;color:var(--ink-soft);font-size:13.5px}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:18px;
  }
  .panel > h2{
    font-size:15px;margin:0 0 12px;letter-spacing:-.01em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sub{color:var(--ink-soft);font-size:12.5px;font-weight:400}
  .badge{
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    background:var(--amber-tint);color:var(--amber-deep);
    border:1px solid #ecdcbf;border-radius:999px;padding:2px 8px;
  }

  /* Dropzone */
  .drop{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:#fbfaf4;
    padding:26px 18px;
    text-align:center;
    transition:border-color .15s, background .15s;
    cursor:pointer;
  }
  .drop.drag{border-color:var(--teal);background:var(--teal-tint)}
  .drop strong{display:block;margin-bottom:4px}
  .drop span{color:var(--ink-soft);font-size:13px}
  .drop input[type=file]{display:none}
  .link{color:var(--teal);text-decoration:underline;font-weight:600}

  /* File list */
  ul.files{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.files li{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fffefb;
  }
  ul.files .name{flex:1;font-size:13.5px;word-break:break-all}
  .tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .tag.ok{background:var(--teal-tint);color:var(--teal-deep);border:1px solid #cfe4e0}
  .tag.no{background:#f0efe8;color:var(--ink-soft);border:1px solid var(--line)}
  button.x{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    width:26px;height:26px;line-height:1;cursor:pointer;color:var(--ink-soft);font-size:15px;
  }
  button.x:hover{color:var(--ink);border-color:#d6d0c0}

  /* Controls */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  label.fld{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  select{
    font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }

  /* Buttons */
  .btn{
    font:inherit;font-weight:600;font-size:13.5px;
    border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid transparent;
  }
  .btn.primary{background:var(--teal);color:#fff}
  .btn.primary:hover{background:var(--teal-deep)}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.amber:hover{background:var(--amber-deep)}

  /* Tables */
  .tablewrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:440px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{
    position:sticky;top:0;background:#f3f1e8;color:var(--ink-soft);
    text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:8px 12px;border-bottom:1px solid #efece1;vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--teal-tint)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .foot{margin-top:10px;color:var(--ink-soft);font-size:12.5px}

  /* Two-column area */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:820px){ .grid2{grid-template-columns:1fr} }

  /* Property cards + chips */
  .propcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fffefb}
  .propcard h3{margin:0 0 9px;font-size:13.5px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;background:#fff;
  }
  .chip b{
    background:var(--teal-tint);color:var(--teal-deep);border-radius:999px;
    padding:1px 8px;font-size:11.5px;font-variant-numeric:tabular-nums;
  }

  .empty{color:var(--ink-soft);font-size:13px;padding:6px 0}
  .stack-actions{margin-top:12px}

  /* Pivot builder */
  .pivot-intro{margin:0 0 14px;color:var(--ink-soft);font-size:13px;max-width:72ch}
  .plabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px}
  .pfields{margin-bottom:14px}
  #pv-pool{
    max-height:140px;overflow:auto;padding:9px;border:1px solid var(--line);
    border-radius:10px;background:#fbfaf4;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;
  }
  .zones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
  @media (max-width:820px){ .zones{grid-template-columns:1fr} }
  .zone{
    min-height:62px;padding:8px;border:1.5px dashed var(--line);border-radius:10px;background:#fbfaf4;
    display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;
    transition:border-color .15s, background .15s;
  }
  .zone.over{border-color:var(--teal);background:var(--teal-tint)}
  .zempty{color:var(--ink-soft);font-size:12px;padding:3px 2px}
  .pchip{
    display:inline-flex;align-items:center;gap:6px;cursor:grab;max-width:100%;
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:#fff;
  }
  .pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pchip:active{cursor:grabbing}
  .pchip.placed{background:var(--teal-tint);border-color:#cfe4e0;color:var(--teal-deep);font-weight:600}
  .pchip .px{border:0;background:transparent;cursor:pointer;font-size:15px;line-height:1;color:inherit;padding:0}
  .zoneadd{
    margin-top:8px;width:100%;font:inherit;font-size:12.5px;padding:6px 8px;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  .pivot-hint{
    font-size:12.5px;color:var(--amber-deep);background:var(--amber-tint);
    border:1px solid #ecdcbf;border-radius:10px;padding:9px 12px;margin:0 0 14px;
  }
  td.rowlab{font-weight:600;white-space:nowrap}
  th.tot,td.tot{background:#f3f1e8;font-weight:700}
  tfoot td{background:#f3f1e8;font-weight:700;border-top:1px solid var(--line);position:sticky;bottom:0}

  a:focus-visible, button:focus-visible, select:focus-visible, .drop:focus-visible{
    outline:2px solid var(--focus);outline-offset:2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>Breezeway Supply Report</h1>
    <p>Drop your Breezeway cleaning exports below. Everything runs in your browser — nothing is uploaded.</p>
  </header>

  <section class="panel">
    <h2>File <span class="sub">CSV / XLSX / XLS · one at a time</span></h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload a spreadsheet file">
      <strong>Drag &amp; drop your Breezeway export here</strong>
      <span>or <span class="link">browse</span> to choose</span>
      <input type="file" id="file" accept=".csv,.xlsx,.xls" />
    </div>
    <ul class="files" id="filelist"></ul>
    <div class="controls" id="reportctl" hidden>
      <label class="fld" for="report">Report</label>
      <select id="report"></select>
    </div>
  </section>

  <div id="results"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  function esc(v){
    return String(v==null?"":v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  var t = function(v){ return (v==null?"":String(v)).trim(); };

  function stripConfig(v){           // "Beach House · Standard clean" -> "Beach House"
    return t(String(v==null?"":v).split("·")[0]);
  }
  function extractDate(v){           // -> "YYYY-MM-DD" or ""
    if(v==null || v==="") return "";
    if(v instanceof Date && !isNaN(v)){
      // Spreadsheet date cells land at UTC midnight — read them in UTC so the
      // calendar date does not slip a day in negative-offset timezones.
      return v.getUTCFullYear()+"-"+String(v.getUTCMonth()+1).padStart(2,"0")+"-"+String(v.getUTCDate()).padStart(2,"0");
    }
    var s = String(v);
    var iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return iso[0];
    var us = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);   // fallback: M/D/YYYY
    if(us) return us[3]+"-"+us[1].padStart(2,"0")+"-"+us[2].padStart(2,"0");
    var d = new Date(s);
    if(!isNaN(d)) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return "";
  }
  function parseQty(v){              // strip non-numeric, parse number
    if(typeof v === "number") return isFinite(v)?v:0;
    if(v==null) return 0;
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g,""));
    return isNaN(n) ? 0 : n;
  }
  function downloadSheet(aoa, cols, sheetName, fileName){
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    if(cols) ws["!cols"] = cols;
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, fileName);
  }

  /* =========================================================================
     REPORT REGISTRY
     Adding a new report type == append one object here. Nothing else changes.
     Each report:
       id          unique key
       label       dropdown text
       sourceMatch regex the source file name (or a sheet name) must match
       sourceHint  the filename we expect, shown to the user
       columns     logical field -> [accepted header variants]  (case-insensitive, first hit wins)
       render(rows) -> HTMLElement   (rows are objects keyed by logical field, raw values)
     ========================================================================= */
  var REPORTS = [
    {
      id: "supplies-weekly",
      label: "Supply lists (weekly)",
      sourceMatch: /supplies-export/i,
      sourceHint: "breezeway-task-supplies-export.csv",
      columns: {
        property: ["Property"],
        date:     ["Completed date", "Due date"],
        cleaner:  ["Completed by", "Assignees"],
        item:     ["Supply name"],
        qty:      ["Supply quantity"]
      },
      render: function(rows){
        /* ---- normalize ---- */
        var clean = rows.map(function(r){
          return {
            property: stripConfig(r.property),
            date:     extractDate(r.date),
            cleaner:  t(r.cleaner),
            item:     t(r.item),
            qty:      parseQty(r.qty)
          };
        }).filter(function(r){ return r.item; });   // drop rows with no item name

        var root = document.createElement("div");

        /* ---- 1. Supply detail (full width, top) ---- */
        var props = {};
        clean.forEach(function(r){ if(r.property) props[r.property] = true; });
        var propCount = Object.keys(props).length;
        var dates = clean.map(function(r){ return r.date; }).filter(Boolean).sort();
        var range = dates.length ? (dates[0] + "  →  " + dates[dates.length-1]) : "no dated lines";

        var detail = document.createElement("section");
        detail.className = "panel";
        detail.innerHTML =
          '<h2>Supply detail ' +
            '<span class="sub">' + clean.length + ' line' + (clean.length===1?"":"s") +
            ' · ' + propCount + ' propert' + (propCount===1?"y":"ies") + '</span></h2>' +
          '<div class="tablewrap"><table><thead><tr>' +
            '<th>Property</th><th>Clean date</th><th>Cleaner</th><th>Item / supply</th><th class="num">Qty</th>' +
          '</tr></thead><tbody>' +
            clean.map(function(r){
              return '<tr><td>' + esc(r.property) + '</td><td>' + esc(r.date) +
                     '</td><td>' + esc(r.cleaner) + '</td><td>' + esc(r.item) +
                     '</td><td class="num">' + esc(r.qty) + '</td></tr>';
            }).join("") +
          '</tbody></table></div>' +
          '<div class="foot">Clean-date range: ' + esc(range) + '</div>' +
          '<div class="stack-actions"><button class="btn primary" id="dl-detail">Download Supply Detail as Excel</button></div>';

        detail.querySelector("#dl-detail").addEventListener("click", function(){
          var aoa = [["Property","Clean date","Cleaner","Item / supply","Qty"]];
          clean.forEach(function(r){ aoa.push([r.property, r.date, r.cleaner, r.item, r.qty]); });
          downloadSheet(aoa, [{wch:30},{wch:13},{wch:22},{wch:38},{wch:7}], "Supply detail", "supply-detail.xlsx");
        });
        root.appendChild(detail);

        /* ---- shared aggregation ---- */
        var byProp = {};        // property -> { item -> qty }
        var byItem = {};        // item -> qty (all properties/files)
        clean.forEach(function(r){
          var p = r.property || "(no property)";
          (byProp[p] = byProp[p] || {});
          byProp[p][r.item] = (byProp[p][r.item] || 0) + r.qty;
          byItem[r.item] = (byItem[r.item] || 0) + r.qty;
        });

        var grid = document.createElement("div");
        grid.className = "grid2";

        /* ---- 2. Requested by property ---- */
        var reqPanel = document.createElement("section");
        reqPanel.className = "panel";
        var propNames = Object.keys(byProp).sort(function(a,b){ return a.localeCompare(b); });
        reqPanel.innerHTML =
          '<h2>Requested by property <span class="sub">' + propNames.length +
            ' propert' + (propNames.length===1?"y":"ies") + '</span></h2>' +
          (propNames.length ? propNames.map(function(p){
            var items = Object.keys(byProp[p]).sort(function(a,b){ return a.localeCompare(b); });
            return '<div class="propcard"><h3>' + esc(p) + '</h3><div class="chips">' +
              items.map(function(it){
                return '<span class="chip">' + esc(it) + ' <b>' + esc(byProp[p][it]) + '</b></span>';
              }).join("") + '</div></div>';
          }).join("") : '<div class="empty">No supply lines to summarize.</div>');
        grid.appendChild(reqPanel);

        /* ---- 3. Overall item-wise breakdown ("to buy") ---- */
        var itemNames = Object.keys(byItem).sort(function(a,b){ return a.localeCompare(b); });
        var totalUnits = itemNames.reduce(function(s,k){ return s + byItem[k]; }, 0);
        var ovPanel = document.createElement("section");
        ovPanel.className = "panel";
        ovPanel.innerHTML =
          '<h2>Overall breakdown <span class="badge">to buy</span> ' +
            '<span class="sub">' + itemNames.length + ' distinct item' + (itemNames.length===1?"":"s") +
            ' · ' + totalUnits + ' unit' + (totalUnits===1?"":"s") + '</span></h2>' +
          '<div class="tablewrap"><table><thead><tr>' +
            '<th>Item / supply</th><th class="num">Total qty</th>' +
          '</tr></thead><tbody>' +
            (itemNames.length ? itemNames.map(function(it){
              return '<tr><td>' + esc(it) + '</td><td class="num">' + esc(byItem[it]) + '</td></tr>';
            }).join("") : '<tr><td colspan="2" class="empty">Nothing to buy yet.</td></tr>') +
          '</tbody></table></div>' +
          '<div class="stack-actions"><button class="btn amber" id="dl-shop">Download shopping list (Excel)</button></div>';

        ovPanel.querySelector("#dl-shop").addEventListener("click", function(){
          var aoa = [["Item / supply","Total qty"]];
          itemNames.forEach(function(it){ aoa.push([it, byItem[it]]); });
          downloadSheet(aoa, [{wch:42},{wch:11}], "Shopping list", "shopping-list.xlsx");
        });
        grid.appendChild(ovPanel);

        root.appendChild(grid);
        return root;
      }
    }

    /* ----------------------------------------------------------------------
       TEMPLATE — copy, uncomment, and adjust to add a new report type.
       No other code needs to change.

    ,{
      id: "payroll-weekly",
      label: "Payroll (weekly)",
      sourceMatch: /payroll-export/i,
      sourceHint: "breezeway-task-payroll-export.csv",
      columns: {
        cleaner:  ["Completed by", "Assignees"],
        property: ["Property"],
        date:     ["Completed date", "Due date"],
        hours:    ["Hours", "Duration"],
        rate:     ["Rate", "Pay rate"]
      },
      render: function(rows){
        var el = document.createElement("section");
        el.className = "panel";
        // ...normalize rows, build tables/cards, wire up XLSX download buttons...
        return el;
      }
    }
    ---------------------------------------------------------------------- */
  ];

  /* ---------- generic engine ---------- */
  function resolveHeader(variants, sampleRow){
    var keys = Object.keys(sampleRow);
    var lower = keys.map(function(k){ return k.trim().toLowerCase(); });
    for(var i=0;i<variants.length;i++){
      var idx = lower.indexOf(variants[i].trim().toLowerCase());
      if(idx >= 0) return keys[idx];
    }
    return null;
  }

  // Map the raw sheet rows onto a report's logical fields.
  function mapRows(report, raw){
    if(!raw.length) return null;
    var sample = null;
    for(var i=0;i<raw.length;i++){ if(raw[i] && Object.keys(raw[i]).length){ sample = raw[i]; break; } }
    sample = sample || raw[0];

    var map = {};
    Object.keys(report.columns).forEach(function(field){
      map[field] = resolveHeader(report.columns[field], sample);
    });

    return raw.map(function(o){
      var row = {};
      Object.keys(report.columns).forEach(function(field){
        row[field] = map[field] != null ? o[map[field]] : null;
      });
      return row;
    });
  }

  // First sheet that actually has rows.
  function readSheet(wb){
    for(var i=0;i<wb.SheetNames.length;i++){
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { defval:null, raw:true });
      if(rows.length) return { sheetName: wb.SheetNames[i], rows: rows };
    }
    return { sheetName: wb.SheetNames[0] || "", rows: [] };
  }
  function headersOf(rows){
    var seen = {}, out = [];
    rows.forEach(function(r){
      Object.keys(r).forEach(function(k){
        if(!seen[k] && !/^__EMPTY/.test(k) && k.trim() !== ""){ seen[k] = 1; out.push(k); }
      });
    });
    return out;
  }

  /* =========================================================================
     PIVOT BUILDER — works on the raw columns of the single uploaded file.
     One file only, so there are no joins and no way to inflate a total.
     ========================================================================= */
  var SEP = "␀";
  var AGGS = {
    sum:    { label:"Sum",          numeric:true,  fn:function(v){ return v.reduce(function(a,b){ return a+b; }, 0); } },
    avg:    { label:"Average",      numeric:true,  fn:function(v){ return v.reduce(function(a,b){ return a+b; }, 0)/v.length; } },
    min:    { label:"Min",          numeric:true,  fn:function(v){ return Math.min.apply(null, v); } },
    max:    { label:"Max",          numeric:true,  fn:function(v){ return Math.max.apply(null, v); } },
    count:  { label:"Count",        numeric:false, fn:function(v){ return v.length; } },
    countu: { label:"Count unique", numeric:false, fn:function(v){
                var s = {}; v.forEach(function(x){ s[x] = 1; }); return Object.keys(s).length; } }
  };

  function pivotNum(v){
    if(typeof v === "number") return isFinite(v) ? v : null;
    if(v == null || v instanceof Date) return null;
    var s = String(v).trim();
    if(!s) return null;
    var hms = s.match(/^(\d+):([0-5]\d):([0-5]\d)$/);   // H:MM:SS -> decimal hours
    if(hms) return (+hms[1]) + (+hms[2])/60 + (+hms[3])/3600;
    var n = parseFloat(s.replace(/[$,\s]/g, ""));
    return isNaN(n) ? null : n;
  }
  function pivotLabel(v){
    if(v == null) return "(blank)";
    if(v instanceof Date) return extractDate(v);
    var s = String(v).trim();
    return s === "" ? "(blank)" : s;
  }
  function fmtNum(n){
    if(n == null || !isFinite(n)) return "";
    return Math.abs(n % 1) < 1e-9 ? String(Math.round(n)) : n.toFixed(2);
  }
  function keyCmp(a, b){
    var na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb) && String(na) === a && String(nb) === b) return na - nb;
    return String(a).localeCompare(String(b));
  }

  function pivotCompute(rows, rowF, colF, valF, aggKey){
    var agg = AGGS[aggKey] || AGGS.count;
    var rowKeys = [], colKeys = [], seenR = {}, seenC = {}, buckets = {};
    rows.forEach(function(r){
      var rk = rowF.length ? rowF.map(function(f){ return pivotLabel(r[f]); }).join(SEP) : "";
      var ck = colF.length ? colF.map(function(f){ return pivotLabel(r[f]); }).join(SEP) : "";
      if(!seenR[rk]){ seenR[rk] = 1; rowKeys.push(rk); }
      if(!seenC[ck]){ seenC[ck] = 1; colKeys.push(ck); }
      var raw = valF ? r[valF] : 1;
      var use = agg.numeric ? pivotNum(raw) : pivotLabel(raw);
      if(agg.numeric && use === null) return;          // skip non-numeric cells
      buckets[rk] = buckets[rk] || {};
      (buckets[rk][ck] = buckets[rk][ck] || []).push(use);
    });
    rowKeys.sort(keyCmp); colKeys.sort(keyCmp);

    function agOf(list){ return list && list.length ? agg.fn(list) : null; }
    function agAll(lists){
      var all = [];
      lists.forEach(function(l){ if(l) all = all.concat(l); });
      return all.length ? agg.fn(all) : null;
    }
    var cells = {}, rowTot = {}, colTot = {}, allLists = [];
    rowKeys.forEach(function(rk){
      cells[rk] = {};
      var mine = [];
      colKeys.forEach(function(ck){
        var list = (buckets[rk] || {})[ck];
        cells[rk][ck] = agOf(list);
        if(list){ mine.push(list); allLists.push(list); }
      });
      rowTot[rk] = agAll(mine);
    });
    colKeys.forEach(function(ck){
      var mine = [];
      rowKeys.forEach(function(rk){ var l = (buckets[rk] || {})[ck]; if(l) mine.push(l); });
      colTot[ck] = agAll(mine);
    });
    return {
      rowKeys: rowKeys, colKeys: colKeys, cells: cells,
      rowTot: rowTot, colTot: colTot, grand: agAll(allLists)
    };
  }

  function buildPivotPanel(rows, headers){
    var pv = { rows: [], cols: [], value: null, agg: "sum" };
    var panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML =
      '<h2>Build your own report <span class="sub">any view of this file</span></h2>' +
      '<p class="pivot-intro">Don\'t see what you\'re looking for above? Drag any field into ' +
        '<b>Rows</b> or <b>Columns</b>, choose a <b>Value</b> to measure, and the table builds itself. ' +
        'Everything stays inside this one file, so the numbers can\'t be skewed by combining sources.</p>' +
      '<div class="pfields"><div class="plabel">Available fields</div><div id="pv-pool"></div></div>' +
      '<div class="zones">' +
        '<div><div class="plabel">Rows</div><div class="zone" id="pv-rows"></div>' +
          '<select class="zoneadd" data-zone="rows"></select></div>' +
        '<div><div class="plabel">Columns</div><div class="zone" id="pv-cols"></div>' +
          '<select class="zoneadd" data-zone="cols"></select></div>' +
        '<div><div class="plabel">Value</div><div class="zone" id="pv-value"></div>' +
          '<select class="zoneadd" data-zone="value"></select>' +
          '<div class="aggrow"><label class="fld" for="pv-agg">Summarise by</label>' +
          '<select id="pv-agg"></select></div></div>' +
      '</div>' +
      '<div class="pivot-hint"><b>Tip:</b> Sum is right for per-row measures like Supply quantity. ' +
        'For a field that repeats across rows of the same task (Total time, Number of people), ' +
        'use Average or Max instead — summing it would multiply by the number of rows.</div>' +
      '<div id="pv-out"></div>' +
      '<div class="stack-actions"><button class="btn primary" id="pv-dl">Download this view as Excel</button></div>';

    var pool   = panel.querySelector("#pv-pool");
    var zRows  = panel.querySelector("#pv-rows");
    var zCols  = panel.querySelector("#pv-cols");
    var zVal   = panel.querySelector("#pv-value");
    var aggSel = panel.querySelector("#pv-agg");
    var out    = panel.querySelector("#pv-out");
    var lastAoa = null;

    Object.keys(AGGS).forEach(function(k){
      var o = document.createElement("option");
      o.value = k; o.textContent = AGGS[k].label;
      aggSel.appendChild(o);
    });
    aggSel.value = pv.agg;
    aggSel.addEventListener("change", function(){ pv.agg = aggSel.value; draw(); });

    function place(field, zone){
      pv.rows = pv.rows.filter(function(x){ return x !== field; });
      pv.cols = pv.cols.filter(function(x){ return x !== field; });
      if(pv.value === field) pv.value = null;
      if(zone === "rows") pv.rows.push(field);
      else if(zone === "cols") pv.cols.push(field);
      else if(zone === "value") pv.value = field;
      draw();
    }
    function remove(field){
      pv.rows = pv.rows.filter(function(x){ return x !== field; });
      pv.cols = pv.cols.filter(function(x){ return x !== field; });
      if(pv.value === field) pv.value = null;
      draw();
    }
    function chip(field, placed){
      var el = document.createElement("span");
      el.className = "pchip" + (placed ? " placed" : "");
      el.draggable = true;
      el.innerHTML = '<span>' + esc(field) + '</span>' +
        (placed ? '<button class="px" title="Remove" aria-label="Remove ' + esc(field) + '">&times;</button>' : '');
      el.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", field);
        e.dataTransfer.effectAllowed = "move";
      });
      if(placed){
        el.querySelector(".px").addEventListener("click", function(e){
          e.stopPropagation(); remove(field);
        });
      }
      return el;
    }
    function wireZone(el, zone){
      el.addEventListener("dragover", function(e){ e.preventDefault(); el.classList.add("over"); });
      el.addEventListener("dragleave", function(){ el.classList.remove("over"); });
      el.addEventListener("drop", function(e){
        e.preventDefault(); el.classList.remove("over");
        var f = e.dataTransfer.getData("text/plain");
        if(f) place(f, zone);
      });
    }
    wireZone(zRows, "rows"); wireZone(zCols, "cols"); wireZone(zVal, "value");
    pool.addEventListener("dragover", function(e){ e.preventDefault(); });
    pool.addEventListener("drop", function(e){
      e.preventDefault();
      var f = e.dataTransfer.getData("text/plain");
      if(f) remove(f);
    });
    // Keyboard / touch fallback: pick a field from a dropdown instead of dragging.
    Array.prototype.forEach.call(panel.querySelectorAll(".zoneadd"), function(sel){
      sel.addEventListener("change", function(){
        if(sel.value){ place(sel.value, sel.dataset.zone); }
      });
    });

    function fillZone(el, fields, emptyText){
      el.innerHTML = "";
      if(!fields.length){
        var e = document.createElement("div");
        e.className = "zempty"; e.textContent = emptyText;
        el.appendChild(e);
        return;
      }
      fields.forEach(function(f){ el.appendChild(chip(f, true)); });
    }

    function draw(){
      var used = pv.rows.concat(pv.cols).concat(pv.value ? [pv.value] : []);
      pool.innerHTML = "";
      var free = headers.filter(function(h){ return used.indexOf(h) < 0; });
      if(!free.length){
        pool.innerHTML = '<div class="zempty">All fields are in use — drag one back here to free it.</div>';
      } else {
        free.forEach(function(h){ pool.appendChild(chip(h, false)); });
      }

      fillZone(zRows, pv.rows, "Drag fields here");
      fillZone(zCols, pv.cols, "Drag fields here");
      fillZone(zVal, pv.value ? [pv.value] : [], "Drag one field here");

      Array.prototype.forEach.call(panel.querySelectorAll(".zoneadd"), function(sel){
        var zone = sel.dataset.zone;
        sel.innerHTML = '<option value="">+ add a field…</option>';
        free.forEach(function(h){
          var o = document.createElement("option");
          o.value = h; o.textContent = h;
          sel.appendChild(o);
        });
        sel.value = "";
        sel.disabled = (zone === "value" && !!pv.value) || !free.length;
      });

      // With no value field the only meaningful measure is a row count.
      var aggKey = pv.value ? pv.agg : "count";
      aggSel.disabled = !pv.value;
      aggSel.value = pv.value ? pv.agg : "count";

      if(!pv.rows.length && !pv.cols.length && !pv.value){
        out.innerHTML = '<div class="empty">Drag at least one field into Rows or Columns to start.</div>';
        lastAoa = null;
        return;
      }

      var p = pivotCompute(rows, pv.rows, pv.cols, pv.value, aggKey);
      if(p.colKeys.length > 60){
        out.innerHTML = '<div class="empty">That column field has ' + p.colKeys.length +
          ' distinct values — too many to show side by side. Try moving it to <b>Rows</b>, ' +
          'or pick a field with fewer values.</div>';
        lastAoa = null;
        return;
      }

      // Keep exported numbers readable: full integers stay exact, derived
      // values (e.g. H:MM:SS converted to hours) round to 4dp instead of 1e-13 tails.
      function xl(v){ return v == null ? "" : Math.round(v * 10000) / 10000; }

      var measure = (pv.value ? AGGS[aggKey].label + " of " + pv.value : "Count of rows");
      var rowHeads = pv.rows.length ? pv.rows.slice() : ["All"];
      var colHeads = p.colKeys.map(function(ck){ return ck === "" ? measure : ck.split(SEP).join(" / "); });

      var aoa = [rowHeads.concat(colHeads).concat(["Total"])];
      var html = '<div class="tablewrap"><table><thead><tr>';
      rowHeads.forEach(function(h){ html += '<th>' + esc(h) + '</th>'; });
      colHeads.forEach(function(h){ html += '<th class="num">' + esc(h) + '</th>'; });
      html += '<th class="num tot">Total</th></tr></thead><tbody>';

      p.rowKeys.forEach(function(rk){
        var labels = pv.rows.length ? rk.split(SEP) : ["All"];
        var line = labels.slice();
        html += '<tr>';
        labels.forEach(function(l){ html += '<td class="rowlab">' + esc(l) + '</td>'; });
        p.colKeys.forEach(function(ck){
          var v = p.cells[rk][ck];
          line.push(xl(v));
          html += '<td class="num">' + esc(fmtNum(v)) + '</td>';
        });
        line.push(xl(p.rowTot[rk]));
        html += '<td class="num tot">' + esc(fmtNum(p.rowTot[rk])) + '</td></tr>';
        aoa.push(line);
      });

      html += '</tbody><tfoot><tr>';
      var footer = ["Total"];
      html += '<td>Total</td>';
      for(var i = 1; i < rowHeads.length; i++){ html += '<td></td>'; footer.push(""); }
      p.colKeys.forEach(function(ck){
        footer.push(xl(p.colTot[ck]));
        html += '<td class="num">' + esc(fmtNum(p.colTot[ck])) + '</td>';
      });
      footer.push(xl(p.grand));
      html += '<td class="num">' + esc(fmtNum(p.grand)) + '</td></tr></tfoot></table></div>' +
        '<div class="foot">' + esc(measure) + ' · ' + p.rowKeys.length + ' row' +
        (p.rowKeys.length === 1 ? "" : "s") + ' × ' + p.colKeys.length + ' column' +
        (p.colKeys.length === 1 ? "" : "s") + '</div>';
      aoa.push(footer);

      out.innerHTML = html;
      lastAoa = aoa;
    }

    panel.querySelector("#pv-dl").addEventListener("click", function(){
      if(!lastAoa){ return; }
      var widths = lastAoa[0].map(function(h, i){
        return { wch: Math.min(40, Math.max(10, String(h).length + 4 + (i === 0 ? 16 : 0))) };
      });
      downloadSheet(lastAoa, widths, "Custom view", "custom-report.xlsx");
    });

    draw();
    return panel;
  }

  /* ---------- UI wiring ---------- */
  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("file");
  var fileListEl = document.getElementById("filelist");
  var reportCtl = document.getElementById("reportctl");
  var reportSel = document.getElementById("report");
  var resultsEl = document.getElementById("results");

  var state = { name:null, rows:[], headers:[], reportId:null };

  (function fillReportSelect(){
    var none = document.createElement("option");
    none.value = ""; none.textContent = "No fixed report — pivot only";
    reportSel.appendChild(none);
    REPORTS.forEach(function(r){
      var opt = document.createElement("option");
      opt.value = r.id; opt.textContent = r.label;
      reportSel.appendChild(opt);
    });
  })();

  function detectReport(name){
    for(var i = 0; i < REPORTS.length; i++){
      if(REPORTS[i].sourceMatch.test(name)) return REPORTS[i];
    }
    return null;
  }

  function renderFileList(){
    fileListEl.innerHTML = "";
    if(!state.name){ reportCtl.hidden = true; return; }
    reportCtl.hidden = false;
    var detected = detectReport(state.name);
    var li = document.createElement("li");
    li.innerHTML =
      '<span class="name">' + esc(state.name) + '</span>' +
      '<span class="tag ' + (detected ? "ok" : "no") + '">' +
        (detected ? "recognized · " + esc(detected.label) : "not recognized") + '</span>' +
      '<button class="x" aria-label="Remove file">&times;</button>';
    li.querySelector("button.x").addEventListener("click", function(){
      state = { name:null, rows:[], headers:[], reportId:null };
      fileInput.value = "";
      renderFileList();
      renderResults();
    });
    fileListEl.appendChild(li);
  }

  function renderResults(){
    resultsEl.innerHTML = "";

    if(!state.name){
      var hint = document.createElement("section");
      hint.className = "panel";
      hint.innerHTML = '<h2>No file yet</h2>' +
        '<div class="empty">Upload one Breezeway export to begin. The report is picked ' +
        'automatically from the file name — recognized so far: ' +
        REPORTS.map(function(r){ return '<b>' + esc(r.sourceHint) + '</b>'; }).join(", ") +
        '. Any other export still works with the pivot builder.</div>';
      resultsEl.appendChild(hint);
      return;
    }

    if(!state.rows.length){
      var er = document.createElement("section");
      er.className = "panel";
      er.innerHTML = '<h2>Nothing to read</h2>' +
        '<div class="empty">That file has no data rows we could parse.</div>';
      resultsEl.appendChild(er);
      return;
    }

    var report = REPORTS.find(function(r){ return r.id === state.reportId; });
    if(report){
      var mapped = mapRows(report, state.rows);
      if(mapped) resultsEl.appendChild(report.render(mapped));
    } else {
      var nb = document.createElement("section");
      nb.className = "panel";
      nb.innerHTML = '<h2>No fixed report for this file</h2>' +
        '<div class="empty">We don\'t have a prebuilt report for <b>' + esc(state.name) +
        '</b> yet — but all ' + state.headers.length + ' of its columns are available in the ' +
        'pivot builder below.</div>';
      resultsEl.appendChild(nb);
    }

    resultsEl.appendChild(buildPivotPanel(state.rows, state.headers));
  }

  var ALLOWED = /\.(csv|xlsx|xls)$/i;

  function setFile(file){
    if(!file || !ALLOWED.test(file.name)){
      alert("Please choose a .csv, .xlsx or .xls file.");
      return;
    }
    var isCsv = /\.csv$/i.test(file.name);
    var reader = new FileReader();
    reader.onload = function(){
      var wb;
      try{
        wb = isCsv
          // CSV: read as UTF-8 text so accented / bilingual item names survive.
          ? XLSX.read(reader.result, { type:"string", cellDates:true })
          : XLSX.read(new Uint8Array(reader.result), { type:"array", cellDates:true });
      }catch(e){
        alert("Could not read that file.");
        return;
      }
      var sheet = readSheet(wb);
      var detected = detectReport(file.name) || detectReport(sheet.sheetName);
      state = {
        name: file.name,
        rows: sheet.rows,
        headers: headersOf(sheet.rows),
        reportId: detected ? detected.id : ""
      };
      reportSel.value = state.reportId;
      renderFileList();
      renderResults();
    };
    reader.onerror = function(){ alert("Could not read that file."); };
    if(isCsv) reader.readAsText(file);
    else reader.readAsArrayBuffer(file);
  }

  drop.addEventListener("click", function(){ fileInput.click(); });
  drop.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener("change", function(){
    if(fileInput.files && fileInput.files[0]) setFile(fileInput.files[0]);
  });

  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("drag"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("drag"); });
  });
  drop.addEventListener("drop", function(e){
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]){
      setFile(e.dataTransfer.files[0]);
    }
  });

  reportSel.addEventListener("change", function(){
    state.reportId = reportSel.value;
    renderResults();
  });

  renderFileList();
  renderResults();
})();
</script>
</body>
</html>
